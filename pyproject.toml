[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbq-cli"
version = "0.3.0"
description = "Secure multi-database CLI for humans and AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "yinpengfei"}]
dependencies = [
  "cryptography>=44",
  "keyring>=25",
  "PyMySQL>=1.1",
  "psycopg[binary]>=3.2",
  "PyYAML>=6",
  "sqlglot>=26,<29",
]

[project.scripts]
dbq = "dbq.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
